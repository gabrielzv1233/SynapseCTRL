[project]
name = "synapsectrl"
version = "0.2.0"
description = "A local Python SDK and CLI for Razer Synapse 4 software profiles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2",
    "websocket-client>=1.9.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
synapsectrl = "synapsectrl.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/synapsectrl"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/pyproject.toml", "/Install-SynapseInspectHook.ps1", "/synapse_ctrl.py", "/astra/*.md", "/astra/*.json", "/astra/tools"]
