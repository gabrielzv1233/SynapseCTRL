[project]
name = "SynapseCTRL"
version = "0.3.0"
description = "A local Python SDK and CLI for Razer Synapse 4 software profiles"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Gabriel", email = "77300296+gabrielzv1233@users.noreply.github.com" },
]
keywords = ["razer", "synapse", "razer-synapse", "profiles", "automation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
dependencies = [
    "psutil>=7.2.2",
    "websocket-client>=1.9.2",
]

[project.optional-dependencies]
http = [
    "starlette>=1.6.0,<2",
    "uvicorn>=0.52.4,<1",
]

[project.urls]
Homepage = "https://github.com/gabrielzv1233/SynapseCTRL"
Documentation = "https://github.com/gabrielzv1233/SynapseCTRL/tree/main/docs"
Repository = "https://github.com/gabrielzv1233/SynapseCTRL"
Issues = "https://github.com/gabrielzv1233/SynapseCTRL/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
synapsectrl = "synapsectrl.entrypoint:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/synapsectrl"]

[tool.hatch.build.targets.wheel.force-include]
"Install-SynapseInspectHook.ps1" = "synapsectrl/Install-SynapseInspectHook.ps1"
"NOTICE" = "synapsectrl/NOTICE"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
    "/Install-SynapseInspectHook.ps1",
    "/synapse_ctrl.py",
    "/codex-stuff/*.md",
    "/codex-stuff/*.json",
    "/codex-stuff/tools",
]
