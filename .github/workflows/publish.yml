name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync project with HTTP extra
        run: uv sync --locked --extra http

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: uv run python -m compileall -q src examples

      - name: Validate native hook installer
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_installer.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_hook_metadata_installer.ps1

      - name: Check CLI entry point
        run: |
          uv run synapsectrl --version
          uv run synapsectrl bridge --help
          uv run synapsectrl serve --help

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke test base wheel
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" python -c "import synapsectrl; print(synapsectrl.__version__)"
          uv run --isolated --no-project --with "$WHEEL" synapsectrl --version
          uv run --isolated --no-project --with "$WHEEL" synapsectrl bridge --help
          uv run --isolated --no-project --with "$WHEEL" synapsectrl serve --help
          uv run --isolated --no-project --with "$WHEEL" python -c "from importlib.resources import files; assert files('synapsectrl').joinpath('Install-SynapseInspectHook.ps1').is_file(); assert files('synapsectrl').joinpath('Install-SynapseHookMetadata.ps1').is_file()"

      - name: Smoke test HTTP extra modules
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" --with "starlette>=1.6.0,<2" --with "uvicorn>=0.52.4,<1" python -c "from synapsectrl.http_api import create_app; print(create_app)"

      - name: Smoke test source distribution
        shell: bash
        run: |
          SDIST=$(ls dist/*.tar.gz)
          uv run --isolated --no-project --with "$SDIST" python -c "import synapsectrl; print(synapsectrl.__version__)"
          uv run --isolated --no-project --with "$SDIST" synapsectrl --version

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          ignore-empty-workdir: true

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PyPI attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish --check-url https://pypi.org/simple/
