name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync project with HTTP extra
        run: uv sync --locked --extra http

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: uv run python -m compileall -q src examples

      - name: Validate native hook installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_installer.ps1

      - name: Check CLI
        run: |
          uv run synapsectrl --version
          uv run synapsectrl bridge --help
          uv run synapsectrl serve --help

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke test base wheel
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" synapsectrl --version
          uv run --isolated --no-project --with "$WHEEL" synapsectrl bridge --help
          uv run --isolated --no-project --with "$WHEEL" synapsectrl serve --help

      - name: Smoke test HTTP extra modules
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" --with "starlette>=1.6.0,<2" --with "uvicorn>=0.52.4,<1" python -c "from synapsectrl.http_api import create_app; print(create_app)"
